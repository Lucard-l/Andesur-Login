# Ubuntu / Apache 2.4: /etc/apache2/sites-available/andesur.conf
# Sustituye el dominio y habilita HTTPS antes de exponer el sitio a Internet.
<VirtualHost *:80>
    ServerName andesur.example.com
    DocumentRoot /var/www/andesur/public

    <Directory /var/www/andesur/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/andesur-error.log
    CustomLog ${APACHE_LOG_DIR}/andesur-access.log combined
</VirtualHost>
