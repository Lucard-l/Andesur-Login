services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: andesur
      POSTGRES_USER: andesur
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - database:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U andesur -d andesur']
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - '8080:8080'
    environment:
      DB_DSN: pgsql:host=db;port=5432;dbname=andesur
      DB_USER: andesur
      DB_PASSWORD: local-development-only
      APP_TIMEZONE: America/La_Paz
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
